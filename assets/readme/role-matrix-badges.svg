<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="100%" height="100%">
  <defs>
    <radialGradient id="roleBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <style>
      @keyframes pulseDot {
        0%, 100% { opacity: 0.3; transform: scale(0.9); }
        50% { opacity: 1; transform: scale(1.1); }
      }
      .dot-pulse {
        animation: pulseDot 2s infinite ease-in-out;
      }
      text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
    </style>
  </defs>

  <rect width="1000" height="240" fill="url(#roleBg)" rx="16" />
  <rect x="2" y="2" width="996" height="236" rx="15" fill="none" stroke="#1E293B" stroke-width="1.5" />

  <!-- Title -->
  <g transform="translate(40, 32)">
    <text x="0" y="0" fill="#38BDF8" font-size="11" font-weight="700" letter-spacing="1.5">MULTI-STAKEHOLDER OPERATIONAL TOPOLOGY</text>
    <text x="0" y="22" fill="#FFFFFF" font-size="17" font-weight="800">6 Specialized Role Boundaries • Zero Implicit Hierarchy</text>
  </g>

  <!-- 6 Role Columns -->
  <g transform="translate(40, 75)">
    <!-- Role 1: Citizen -->
    <g transform="translate(0, 0)">
      <rect width="140" height="135" rx="10" fill="#1E293B" stroke="#38BDF8" stroke-width="1.2" />
      <rect x="0" y="0" width="140" height="26" rx="10" fill="#0284C7" fill-opacity="0.3" />
      <circle cx="12" cy="13" r="3.5" fill="#38BDF8" />
      <text x="22" y="16" fill="#BAE6FD" font-size="10" font-weight="800">CITIZEN</text>
      
      <text x="10" y="44" fill="#E2E8F0" font-size="9" font-weight="700">General Public</text>
      <text x="10" y="60" fill="#94A3B8" font-size="8">• Self-registration</text>
      <text x="10" y="74" fill="#94A3B8" font-size="8">• Send SOS Beacon</text>
      <text x="10" y="88" fill="#94A3B8" font-size="8">• Photo Incident</text>
      <text x="10" y="102" fill="#94A3B8" font-size="8">• Safe Check-in</text>
      <text x="10" y="116" fill="#94A3B8" font-size="8">• Evacuation Map</text>
    </g>

    <!-- Role 2: Field Responder -->
    <g transform="translate(155, 0)">
      <rect width="140" height="135" rx="10" fill="#1E293B" stroke="#F59E0B" stroke-width="1.2" />
      <rect x="0" y="0" width="140" height="26" rx="10" fill="#D97706" fill-opacity="0.3" />
      <circle cx="12" cy="13" r="3.5" fill="#F59E0B" />
      <text x="22" y="16" fill="#FDE68A" font-size="10" font-weight="800">RESPONDER</text>

      <text x="10" y="44" fill="#E2E8F0" font-size="9" font-weight="700">NDRF / SDRF</text>
      <text x="10" y="60" fill="#94A3B8" font-size="8">• Field Verification</text>
      <text x="10" y="74" fill="#94A3B8" font-size="8">• Incident Triage</text>
      <text x="10" y="88" fill="#94A3B8" font-size="8">• SOS Response</text>
      <text x="10" y="102" fill="#94A3B8" font-size="8">• Offline Mesh Sync</text>
      <text x="10" y="116" fill="#94A3B8" font-size="8">• Shelter Check-in</text>
    </g>

    <!-- Role 3: Local Official -->
    <g transform="translate(310, 0)">
      <rect width="140" height="135" rx="10" fill="#1E293B" stroke="#10B981" stroke-width="1.2" />
      <rect x="0" y="0" width="140" height="26" rx="10" fill="#059669" fill-opacity="0.3" />
      <circle cx="12" cy="13" r="3.5" fill="#10B981" />
      <text x="22" y="16" fill="#A7F3D0" font-size="10" font-weight="800">LOCAL OFFICIAL</text>

      <text x="10" y="44" fill="#E2E8F0" font-size="9" font-weight="700">Block / Village Head</text>
      <text x="10" y="60" fill="#94A3B8" font-size="8">• Habitation Census</text>
      <text x="10" y="74" fill="#94A3B8" font-size="8">• Hazard Red-Zones</text>
      <text x="10" y="88" fill="#94A3B8" font-size="8">• Vulnerability Index</text>
      <text x="10" y="102" fill="#94A3B8" font-size="8">• Shelter Capacity</text>
      <text x="10" y="116" fill="#94A3B8" font-size="8">• Damage Reports</text>
    </g>

    <!-- Role 4: District / Command -->
    <g transform="translate(465, 0)">
      <rect width="140" height="135" rx="10" fill="#1E293B" stroke="#EF4444" stroke-width="1.2" />
      <rect x="0" y="0" width="140" height="26" rx="10" fill="#DC2626" fill-opacity="0.3" />
      <circle cx="12" cy="13" r="3.5" fill="#EF4444" />
      <text x="22" y="16" fill="#FECDD3" font-size="10" font-weight="800">COMMAND</text>

      <text x="10" y="44" fill="#E2E8F0" font-size="9" font-weight="700">DDMA District Head</text>
      <text x="10" y="60" fill="#94A3B8" font-size="8">• Relocation Queue</text>
      <text x="10" y="74" fill="#94A3B8" font-size="8">• Broadcast Alerts</text>
      <text x="10" y="88" fill="#94A3B8" font-size="8">• Command Center</text>
      <text x="10" y="102" fill="#94A3B8" font-size="8">• Resource Dispatch</text>
      <text x="10" y="116" fill="#94A3B8" font-size="8">• Incident Approval</text>
    </g>

    <!-- Role 5: State / Admin -->
    <g transform="translate(620, 0)">
      <rect width="140" height="135" rx="10" fill="#1E293B" stroke="#8B5CF6" stroke-width="1.2" />
      <rect x="0" y="0" width="140" height="26" rx="10" fill="#7C3AED" fill-opacity="0.3" />
      <circle cx="12" cy="13" r="3.5" fill="#8B5CF6" />
      <text x="22" y="16" fill="#DDD6FE" font-size="10" font-weight="800">STATE ADMIN</text>

      <text x="10" y="44" fill="#E2E8F0" font-size="9" font-weight="700">SDMA State Level</text>
      <text x="10" y="60" fill="#94A3B8" font-size="8">• State Disaster Ops</text>
      <text x="10" y="74" fill="#94A3B8" font-size="8">• Multi-District KPIs</text>
      <text x="10" y="88" fill="#94A3B8" font-size="8">• Strategic Stockpile</text>
      <text x="10" y="102" fill="#94A3B8" font-size="8">• High-Priority Alerts</text>
      <text x="10" y="116" fill="#94A3B8" font-size="8">• SDMA Handover</text>
    </g>

    <!-- Role 6: System Admin -->
    <g transform="translate(775, 0)">
      <rect width="140" height="135" rx="10" fill="#1E293B" stroke="#06B6D4" stroke-width="1.2" />
      <rect x="0" y="0" width="140" height="26" rx="10" fill="#0891B2" fill-opacity="0.3" />
      <circle cx="12" cy="13" r="3.5" fill="#06B6D4" />
      <text x="22" y="16" fill="#CFFAFE" font-size="10" font-weight="800">SYSTEM ADMIN</text>

      <text x="10" y="44" fill="#E2E8F0" font-size="9" font-weight="700">Platform Custodian</text>
      <text x="10" y="60" fill="#94A3B8" font-size="8">• RBAC Overrides</text>
      <text x="10" y="74" fill="#94A3B8" font-size="8">• Technical Config</text>
      <text x="10" y="88" fill="#94A3B8" font-size="8">• Gemini API Toggle</text>
      <text x="10" y="102" fill="#94A3B8" font-size="8">• Sync Interval Sec</text>
      <text x="10" y="116" fill="#94A3B8" font-size="8">• Audit Logs Viewer</text>
    </g>
  </g>
</svg>
