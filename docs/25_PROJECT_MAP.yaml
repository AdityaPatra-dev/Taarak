# TAARAK — machine-readable project map
# Generated from direct repository inspection (5 parallel research passes +
# direct verification), not from assumptions. See docs/*.md for full detail
# and evidence behind every claim below. "files:" lists only the most
# structurally important files — full per-file dossiers live in
# docs/modules/<module>.md.

project:
  name: taarak
  purpose: >
    Offline-first Flutter disaster-management app (SIH 2026, PS 26191):
    identifies hazard zones, scores habitation risk, tracks shelter
    capacity, and produces an explainable relocation-priority queue for
    disaster-management authorities.
  frontend: "Flutter (Dart 3), Riverpod state management, go_router navigation"
  backend: "Firebase (Auth + Cloud Firestore), project taakrak-d9ed0 — real and live. A dormant secondary backend (shelf/shelf_router Dart stub in backend/) exists but is never selected at runtime."
  database: "Drift (typed SQLite) — 18 tables, schema version 11, destructive migration strategy"
  state_management: "Riverpod (flutter_riverpod ^2.6.1) — Provider for DI, FutureProvider.autoDispose for screen data, one AsyncNotifierProvider for auth session, root-lifetime Provider.autoDispose<void> triggers for background behavior"
  authentication: "Firebase Auth, email/password. Public self-registration is Citizen-only by hard structural design. A dormant in-memory mock-auth path exists (DevMockAuthRemoteDataSource) but is never selected (AppConfig.useMockAuth is always false)."

